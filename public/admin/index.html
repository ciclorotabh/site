<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Painel do CicloRota BH</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js" integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr" crossorigin="anonymous"></script>
  <script>
    // O login usa o endereço onde o painel está aberto (endereço de teste ou ciclorotabh.com).
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'ciclorotabh/site',
          branch: 'main',
          base_url: window.location.origin,
          auth_endpoint: 'api/auth',
        },
      },
    });
    CMS.registerPreviewStyle('/admin/previa.css');
  </script>
</body>
</html>
