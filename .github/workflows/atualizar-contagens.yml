name: atualizar-contagens

# Lê a planilha de contagens publicada na Web (CSV) e atualiza src/data/contagens.json.
# Configuração: variáveis do repositório CONTAGENS_CSV_URL (obrigatória) e, se a planilha tiver três abas,
# CONTAGENS_HORAS_CSV_URL e CONTAGENS_LOCAIS_CSV_URL.
on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 6h17 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-contagens
  cancel-in-progress: false

jobs:
  atualizar:
    if: ${{ vars.CONTAGENS_CSV_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do gerador
        run: python3 -m unittest discover -s scripts/tests
      - name: Gerar o JSON a partir da planilha
        env:
          HIST: ${{ vars.CONTAGENS_CSV_URL }}
          HORAS: ${{ vars.CONTAGENS_HORAS_CSV_URL }}
          LOCAIS: ${{ vars.CONTAGENS_LOCAIS_CSV_URL }}
        run: |
          args=(--csv-historico "$HIST")
          [ -n "$HORAS" ] && args+=(--csv-horas "$HORAS")
          [ -n "$LOCAIS" ] && args+=(--csv-locais "$LOCAIS")
          python3 scripts/atualizar_contagens.py "${args[@]}"
      - name: Commit se mudou
        run: |
          # geradoEm muda sempre; só vale commit se mudou algum dado
          if git diff --quiet -I '"geradoEm"' -- src/data/contagens.json; then
            echo "Sem contagem nova."; git checkout -- src/data/contagens.json; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contagens.json
          git commit -m "Contagens atualizadas da planilha"
          git push
