name: testes

on:
  pull_request: {}
  push:
    branches: [main]
    paths-ignore: ['src/content/**', 'src/data/**']

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests
      - run: npm run build
